<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="description" content="Halloween a Terra Nostra">
        <meta name="theme-color" content="#1a0033">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }

            html {
                -webkit-text-size-adjust: 100%;
            }

            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 16px;
                line-height: 1.5;
                color: #fff;
                background: linear-gradient(135deg, #1a0a00 0%, #2d1810 25%, #1a0a00 50%, #2d1810 75%, #1a0a00 100%);
                background-color: #1a0a00;
                background-size: 400% 400%;
                animation: gradientShift 15s ease infinite;
            }

            @keyframes gradientShift {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            /* Header */
            .hero {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
                text-align: center;
                padding: 32px 16px 40px;
                padding-top: max(32px, env(safe-area-inset-top));
                background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #1a0033 100%);
                box-shadow: inset 0 0 60px rgba(102, 0, 153, 0.3);
            }

            .hero::before,
            .hero::after {
                content: "🎃";
                position: absolute;
                font-size: 120px;
                line-height: 1;
                opacity: 0.1;
                pointer-events: none;
            }

            .hero::before {
                top: -20px;
                left: -20px;
                transform: rotate(-15deg);
            }

            .hero::after {
                bottom: -20px;
                right: -20px;
                transform: rotate(15deg);
            }

            .pumpkin-icon {
                display: inline-block;
                font-size: 48px;
                line-height: 1;
                animation: bounce 2s ease-in-out infinite;
            }

            @keyframes bounce {
                0%, 100% { transform: translateY(0) rotate(-5deg); }
                50% { transform: translateY(-12px) rotate(5deg); }
            }

            .hero h1 {
                margin: 12px 0;
                font-family: 'Creepster', cursive;
                font-weight: normal;
                font-size: clamp(40px, 12vw, 72px);
                line-height: 1.05;
                color: #ff6600;
                text-shadow: 3px 3px 6px #000, 0 0 20px #ff6600, 0 0 40px #ff3300;
                animation: glow 2s ease-in-out infinite alternate;
            }

            @keyframes glow {
                from { text-shadow: 3px 3px 6px #000, 0 0 20px #ff6600, 0 0 40px #ff3300; }
                to { text-shadow: 3px 3px 6px #000, 0 0 30px #ff6600, 0 0 60px #ff3300, 0 0 80px #ff6600; }
            }

            .lead {
                margin: 16px 0 0;
                font-size: 20px;
                font-weight: bold;
                color: #ffaa00;
                text-shadow: 2px 2px 4px #000;
            }

            .event-time {
                margin: 4px 0 0;
                font-size: 16px;
                color: #ffd9b3;
            }

            /* Countdown, filled in by countdown.js */
            #demo {
                width: 100%;
                max-width: 480px;
                margin: 24px auto 0;
                padding: 16px;
                font-size: clamp(20px, 6vw, 28px);
                font-weight: bold;
                line-height: 1.3;
                color: #fff;
                text-shadow: 2px 2px 4px #000;
                background: rgba(255, 102, 0, 0.2);
                border: 2px solid #ff6600;
                border-radius: 12px;
            }

            #demo:empty {
                display: none;
            }

            #demo h1,
            #demo h2 {
                margin: 0;
                font-size: inherit;
            }

            #demo a {
                display: block;
                padding: 16px;
                font-family: 'Creepster', cursive;
                font-weight: normal;
                font-size: clamp(28px, 9vw, 40px);
                color: #1a0033;
                text-decoration: none;
                text-shadow: none;
                background: #ff6600;
                border-radius: 8px;
            }

            #demo a:active {
                background: #ff8533;
            }

            /* Footer */
            footer {
                padding: 32px 16px;
                padding-bottom: max(32px, env(safe-area-inset-bottom));
                text-align: center;
                background: rgba(0, 0, 0, 0.8);
                border-top: 3px solid #ff6600;
            }

            footer .emojis {
                margin: 0;
                font-size: clamp(16px, 5vw, 24px);
                letter-spacing: 2px;
            }

            footer .greeting {
                margin: 8px 0 0;
                font-size: 18px;
                color: #ff6600;
                text-shadow: 2px 2px 4px #000;
            }

            /* Floating bats: decoration only, never block taps */
            .bats {
                position: fixed;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
                z-index: 10;
            }

            .bat {
                position: absolute;
                font-size: 24px;
                animation: flyAround 20s linear infinite;
            }

            @keyframes flyAround {
                0% { transform: translate(0, 0) rotate(0deg); }
                25% { transform: translate(60vw, 30vh) rotate(90deg); }
                50% { transform: translate(40vw, 60vh) rotate(180deg); }
                75% { transform: translate(-10vw, 40vh) rotate(270deg); }
                100% { transform: translate(0, 0) rotate(360deg); }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation: none !important;
                }
            }
        </style>

        <title>🎃 Halloween a Terra Nostra 🎃</title>
    </head>
    <body>
        <!-- Floating bat decorations -->
        <div class="bats" aria-hidden="true">
            <div class="bat" style="top: 10%; left: 5%;">🦇</div>
            <div class="bat" style="top: 30%; left: 60%; animation-delay: -5s;">🦇</div>
            <div class="bat" style="top: 20%; left: 30%; animation-delay: -10s;">🦇</div>
        </div>

        <header class="hero">
            <span class="pumpkin-icon" aria-hidden="true">🎃</span>
            <h1>Halloween a Terra Nostra</h1>
            <p class="lead">👻 queda molt poc 👻</p>
            <p class="event-time">31 d'octubre · 18:00 – 20:30</p>
            <!-- Display the countdown timer in an element -->
            <div id="demo"></div>
        </header>

        <!-- Halloween footer -->
        <footer>
            <p class="emojis" aria-hidden="true">🎃 👻 🦇 🕸️ 🕷️ 💀 🧛 🧙 🍬 🍭 🎃</p>
            <p class="greeting">Bon Halloween! 🎃</p>
        </footer>

        <script src="countdown.js"></script>
    </body>
</html>
